<a id="article-toc"></a>
<details class="article-inline-toc" open>
    <summary><strong>文章目錄（點擊章節可直接跳轉，也可收合）</strong></summary>
    <ol>
        {{- range .Items }}
        <li>
            <a href="#{{ .id }}">{{ .title | plainify }}</a>
            {{- with .children }}
            <ol>
                {{- range . }}
                <li><a href="#{{ .id }}">{{ .title | plainify }}</a></li>
                {{- end }}
            </ol>
            {{- end }}
        </li>
        {{- end }}
    </ol>
</details>
